name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for a build-only artifact
        required: true
        default: v0.1.0
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CGO_ENABLED: '0'
      RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$') { throw 'Invalid release version' }
      - run: go test -timeout 2m ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build Windows x64 executable
        run: go build -trimpath -ldflags "-s -w -X=github.com/keshon/portable-updater/internal/app.Version=$env:RELEASE_VERSION" -o portable-update.exe ./cmd/portable-updater
      - name: Package release
        run: go run ./cmd/package -version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: portable-updater-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist -Filter '*.zip' | Select-Object -ExpandProperty FullName
          gh release create $env:RELEASE_VERSION $archive dist/SHA256SUMS.txt --verify-tag --title "Portable Updater $env:RELEASE_VERSION" --notes-file dist/RELEASE-NOTES.md
